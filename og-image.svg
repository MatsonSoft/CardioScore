<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Calculator + Heart Logo (large, centered, same as favicon) -->
  <g transform="translate(540, 165)">
    <rect x="0" y="0" width="120" height="135" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="16" y="16" width="88" height="32" rx="5" fill="#0f172a"/>
    <g fill="#94a3b8">
      <rect x="16" y="60" width="22" height="16" rx="4"/>
      <rect x="46" y="60" width="22" height="16" rx="4"/>
      <rect x="76" y="60" width="22" height="16" rx="4"/>
      <rect x="16" y="84" width="22" height="16" rx="4"/>
      <rect x="46" y="84" width="22" height="16" rx="4"/>
      <rect x="76" y="84" width="22" height="16" rx="4"/>
      <rect x="16" y="108" width="22" height="16" rx="4"/>
      <rect x="46" y="108" width="22" height="16" rx="4"/>
      <rect x="76" y="108" width="22" height="16" rx="4"/>
    </g>
    <!-- Heart -->
    <path d="M60,170 C60,170 24,147 24,122 24,107 35,97 47,97 53,97 57,101 60,108 63,101 67,97 73,97 85,97 96,107 96,122 96,147 60,170 60,170 Z" fill="#ef4444"/>
  </g>

  <!-- CardioScore text -->
  <text x="600" y="470" font-family="Montserrat, system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CardioScore</text>
  <text x="600" y="510" font-family="Montserrat, system-ui, sans-serif" font-size="22" font-weight="500" fill="#93c5fd" text-anchor="middle" letter-spacing="2">CALCULADORA DE RIESGO CARDIOVASCULAR</text>

  <!-- MatsonSoft -->
  <text x="600" y="565" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">MatsonSoft</text>
</svg>
